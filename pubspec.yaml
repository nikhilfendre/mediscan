name: mediscan_app
description: MediScan - AI-assisted skin-lesion screening app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.6
  image_picker: ^1.0.8
  path_provider: ^2.1.4
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.2.0
  tflite_flutter: ^0.12.1
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labels.txt
    - assets/model/skin_model.tflite
    - assets/labels_clinical.txt
    - assets/model/skin_clinical_model.tflite
    - assets/labels_xray.txt
    - assets/model/xray_model.tflite
    - assets/labels_bone.txt
    - assets/model/bone_model.tflite
    - assets/labels_knee.txt
    - assets/model/knee_model.tflite
    - assets/labels_dental.txt
    - assets/model/dental_model.tflite
    - assets/google_g.png
